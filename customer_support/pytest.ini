[pytest]
# Pytest configuration for customer support tests

# Register custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    ragas: marks tests that use Ragas evaluation framework
    integration: marks tests as integration tests
    performance: marks tests that measure performance metrics
    unit: marks tests as unit tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Asyncio mode
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage options (optional)
# --cov=src
# --cov-report=html
# --cov-report=term-missing

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test paths
testpaths = tests

# Timeout (optional, requires pytest-timeout)
# timeout = 300
