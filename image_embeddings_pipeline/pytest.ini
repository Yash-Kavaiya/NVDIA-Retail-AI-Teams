# Pytest configuration for image embeddings pipeline tests

[tool:pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for complete workflows
    slow: Tests that take more than 5 seconds
    api: Tests that require NVIDIA API access
    qdrant: Tests that require Qdrant database
    network: Tests that require network access
    search: Search functionality tests
    pipeline: Pipeline processing tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    
# Asyncio configuration
asyncio_mode = auto

# Coverage options (when using pytest-cov)
# addopts = --cov=src --cov-report=html --cov-report=term

# Test timeout (requires pytest-timeout)
# timeout = 300

# Minimum Python version
minversion = 3.8

# Log configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Ignore certain warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
